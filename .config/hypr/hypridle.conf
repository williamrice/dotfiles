general {
    lock_cmd = ~/.local/bin/lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Wait for the compositor's lock acknowledgement before allowing suspend.
    inhibit_sleep = 3
    on_lock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
