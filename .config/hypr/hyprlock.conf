$font = FiraCode Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(10151d)
}

image {
    monitor =
    path = ~/Pictures/archlinux-logo-light.png
    size = 240
    rounding = 0
    border_size = 0
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(edf3fa)
    font_size = 72
    font_family = $font
    position = 0, -100
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %d'
    color = rgb(b9e5fb)
    font_size = 18
    font_family = $font
    position = 0, -220
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 400, 64
    outline_thickness = 3
    rounding = 16
    inner_color = rgba(162230cc)
    outer_color = rgba(287da8d9)
    check_color = rgb(b9e5fb)
    fail_color = rgb(f38c8c)
    capslock_color = rgb(59b9e8)
    font_color = rgb(edf3fa)
    font_family = $font
    placeholder_text = Password for $USER
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -140
    halign = center
    valign = center
}
