# More option see https://github.com/DreamMaoMao/mango/wiki/

# Environment
# Use qt6ct for Qt 6 theming and prefer native Wayland rendering.
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORM,wayland

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
# Make Mango's Wayland display and desktop identity available to D-Bus/systemd
# services before portal backends are activated.
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP
exec-once=waybar -c ~/.config/mango/waybar/config.jsonc -s ~/.config/mango/waybar/style.css
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focusdir_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0x32cd32ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
# Keep tags 1-5 on the LG UltraGear (DP-1) and tags 6-9 on the Dell (DP-2).
# no_hide keeps each assigned tag visible in Mangobar even when it is empty.
tagrule=id:1,monitor_name:DP-1,no_hide:1,layout_name:tile
tagrule=id:2,monitor_name:DP-1,no_hide:1,layout_name:tile
tagrule=id:3,monitor_name:DP-1,no_hide:1,layout_name:tile
tagrule=id:4,monitor_name:DP-1,no_hide:1,layout_name:tile
tagrule=id:5,monitor_name:DP-1,no_hide:1,layout_name:tile
tagrule=id:6,monitor_name:DP-2,no_hide:1,layout_name:tile
tagrule=id:7,monitor_name:DP-2,no_hide:1,layout_name:tile
tagrule=id:8,monitor_name:DP-2,no_hide:1,layout_name:tile
tagrule=id:9,monitor_name:DP-2,no_hide:1,layout_name:tile

# Key bindings translated from hypr/config/keybindings.lua.
# Key names come from `wev`; modifiers are SUPER, CTRL, ALT, SHIFT, or NONE.

# Applications and window state
bind=SUPER,Return,spawn,ghostty
bind=SUPER,q,killclient
bind=SUPER,e,spawn,thunar
bind=SUPER,w,spawn,google-chrome-stable
bind=SUPER+SHIFT,w,spawn,work
bind=SUPER+SHIFT,f,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,space,spawn,rofi -show drun

# Dwindle controls
# Hypr togglesplit controls the next split; Mango's closest equivalent toggles
# the configured split direction. swapsplit maps to Mango's current-split toggle.
bind=SUPER,slash,dwindle_toggle_split_direction
bind=SUPER,backslash,dwindle_toggle_current_split
# Mango has no exact equivalent for Hypr's local `splitratio 1.0 exact`.
# set_proportion=1.0 preserves the intent when using a scroller layout.
bind=SUPER,v,set_proportion,1.0

# Directional focus (vim keys)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Tags correspond to Hypr workspaces. Mango supports tags 1-9 only, so the
# Hypr workspace-10 bindings (SUPER+0 / SUPER+SHIFT+0) cannot be represented.
bind=SUPER,1,viewcrossmon,1,DP-1
bind=SUPER,2,viewcrossmon,2,DP-1
bind=SUPER,3,viewcrossmon,3,DP-1
bind=SUPER,4,viewcrossmon,4,DP-1
bind=SUPER,5,viewcrossmon,5,DP-1
bind=SUPER,6,viewcrossmon,6,DP-2
bind=SUPER,7,viewcrossmon,7,DP-2
bind=SUPER,8,viewcrossmon,8,DP-2
bind=SUPER,9,viewcrossmon,9,DP-2

# Move the focused window directly to its tag's assigned monitor. Physical
# keycodes avoid Shift changing number-row keysyms (1 -> !, 2 -> @, etc.).
bind=SUPER+SHIFT,code:10,tagcrossmon,1,DP-1
bind=SUPER+SHIFT,code:11,tagcrossmon,2,DP-1
bind=SUPER+SHIFT,code:12,tagcrossmon,3,DP-1
bind=SUPER+SHIFT,code:13,tagcrossmon,4,DP-1
bind=SUPER+SHIFT,code:14,tagcrossmon,5,DP-1
bind=SUPER+SHIFT,code:15,tagcrossmon,6,DP-2
bind=SUPER+SHIFT,code:16,tagcrossmon,7,DP-2
bind=SUPER+SHIFT,code:17,tagcrossmon,8,DP-2
bind=SUPER+SHIFT,code:18,tagcrossmon,9,DP-2

# Move/swap the focused tiled window by direction
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Move the focused window between monitors
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# Resize the focused window in 45-pixel steps
bind=SUPER+ALT,h,resizewin,-45,0
bind=SUPER+ALT,l,resizewin,+45,0
bind=SUPER+ALT,k,resizewin,0,-45
bind=SUPER+ALT,j,resizewin,0,+45

# Scratchpad: hide the focused window, then show/hide the scratchpad pool.
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,minimized

# Mouse workspace navigation and window drag/resize
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Multimedia keys. The l flag keeps these active while the screen is locked.
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86Favorites,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# Utilities
# Restart Waybar with Mango's dedicated config (Hyprland uses its own config).
bind=SUPER+SHIFT,r,spawn_shell,pkill -x waybar; waybar -c ~/.config/mango/waybar/config.jsonc -s ~/.config/mango/waybar/style.css
bind=NONE,Print,spawn,screenshot
bind=SUPER,p,spawn,copyq toggle
bind=SUPER+SHIFT,p,spawn,hyprpicker -labrn --scale=8 --radius=150


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
