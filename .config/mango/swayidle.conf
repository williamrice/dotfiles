# Confirm the session is locked before powering off displays after ten minutes.
timeout 600 '/home/warice/.local/bin/lock-screen --screen-off' resume '/usr/bin/wlr-dpms on'
lock '/home/warice/.local/bin/lock-screen'
before-sleep '/home/warice/.local/bin/lock-screen'
after-resume '/usr/bin/wlr-dpms on'
