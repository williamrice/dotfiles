[bind.default]

# Applications and window state
"SUPER+Return" = "spawn,ghostty"
"SUPER+q" = "killclient"
"SUPER+e" = "spawn,thunar"
"SUPER+w" = "spawn,firefox-developer-edition"
"SUPER+SHIFT+code:25" = "spawn,google-chrome-stable"
"SUPER+SHIFT+f" = "togglefloating"
"SUPER+f" = "togglefullscreen"
"SUPER+space" = "spawn,rofi -show drun"

# Dwindle
"SUPER+slash" = "dwindle_toggle_split_direction"
"SUPER+backslash" = "dwindle_toggle_current_split"
# Scroller
"SUPER+v" = "set_proportion,1.0"

# Focus
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"

# Tag selection
"SUPER+1" = "viewcrossmon,1,DP-1"
"SUPER+2" = "viewcrossmon,2,DP-1"
"SUPER+3" = "viewcrossmon,3,DP-1"
"SUPER+4" = "viewcrossmon,4,DP-1"
"SUPER+5" = "viewcrossmon,5,DP-1"
"SUPER+6" = "viewcrossmon,6,DP-2"
"SUPER+7" = "viewcrossmon,7,DP-2"
"SUPER+8" = "viewcrossmon,8,DP-2"
"SUPER+9" = "viewcrossmon,9,DP-2"

# Move windows to tags. Physical keycodes avoid Shift remapping number keys.
"SUPER+SHIFT+code:10" = "tagcrossmon,1,DP-1"
"SUPER+SHIFT+code:11" = "tagcrossmon,2,DP-1"
"SUPER+SHIFT+code:12" = "tagcrossmon,3,DP-1"
"SUPER+SHIFT+code:13" = "tagcrossmon,4,DP-1"
"SUPER+SHIFT+code:14" = "tagcrossmon,5,DP-1"
"SUPER+SHIFT+code:15" = "tagcrossmon,6,DP-2"
"SUPER+SHIFT+code:16" = "tagcrossmon,7,DP-2"
"SUPER+SHIFT+code:17" = "tagcrossmon,8,DP-2"
"SUPER+SHIFT+code:18" = "tagcrossmon,9,DP-2"

# Window placement
"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+l" = "exchange_client,right"

# Monitor navigation
"SUPER+SHIFT+comma" = "tagmon,left"
"SUPER+SHIFT+period" = "tagmon,right"

# Resize
"SUPER+ALT+h" = "resizewin,-45,0"
"SUPER+ALT+l" = "resizewin,+45,0"
"SUPER+ALT+k" = "resizewin,0,-45"
"SUPER+ALT+j" = "resizewin,0,+45"

# Scratchpad
"SUPER+grave" = "toggle_scratchpad"
"SUPER+SHIFT+grave" = "minimized"

# Utilities
"SUPER+r" = "reload_config"
"SUPER+SHIFT+r" = "spawn_shell,pkill -x waybar; waybar"
"SUPER+CTRL+l" = "spawn,/home/warice/.local/bin/lock-screen"
"Print" = "spawn,~/.local/bin/screenshot"
"SUPER+p" = "spawn,copyq --start-server toggle"
"SUPER+SHIFT+p" = "spawn,wl-color-picker clipboard"

[bind.default.lock]

# Media bindings remain active while locked.
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86Favorites" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86MonBrightnessUp" = "spawn,brightnessctl -e4 -n2 set 5%+"
"XF86MonBrightnessDown" = "spawn,brightnessctl -e4 -n2 set 5%-"
"XF86AudioNext" = "spawn,playerctl next"
# AudioPause and AudioPlay resolve to the same keycode; bind only once.
"XF86AudioPlay" = "spawn,playerctl play-pause"
"XF86AudioPrev" = "spawn,playerctl previous"

[axisbind.default]

# Mouse wheel navigation
"SUPER+DOWN" = "viewtoright_have_client"
"SUPER+UP" = "viewtoleft_have_client"

[mousebind.default]

"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"
