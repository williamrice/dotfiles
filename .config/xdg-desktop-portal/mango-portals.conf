# Portal routing used only when XDG_CURRENT_DESKTOP=mango.
[preferred]
# GTK provides file pickers and the other general desktop portals.
default=gtk

# wlroots provides native Wayland screen sharing and screenshots for MangoWM.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# KWallet is the installed backend that implements the Secret portal.
org.freedesktop.impl.portal.Secret=kwallet
